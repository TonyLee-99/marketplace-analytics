version: 2

models:
  - name: stg_olist__orders
    description: Typed orders, one row per order.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('stg_olist__customers'), field: customer_id}
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]
      - name: purchased_at
        data_tests: [not_null]
      - name: estimated_delivery_date
        data_tests: [not_null]

  - name: stg_olist__order_items
    columns:
      - name: order_item_key
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_olist__orders'), field: order_id}
      - name: product_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_olist__products'), field: product_id}
      - name: seller_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_olist__sellers'), field: seller_id}
      - name: price_brl
        data_tests:
          - not_null
          - within_range: {arguments: {min_value: 0.01}}
      - name: freight_brl
        data_tests:
          - not_null
          - within_range: {arguments: {min_value: 0}}

  - name: stg_olist__payments
    columns:
      - name: payment_key
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_olist__orders'), field: order_id}
      - name: payment_type
        data_tests:
          - accepted_values:
              arguments:
                values: [credit_card, boleto, voucher, debit_card, not_defined]
      - name: payment_value_brl
        data_tests:
          - within_range: {arguments: {min_value: 0}}

  - name: stg_olist__reviews
    columns:
      - name: review_key
        data_tests: [unique, not_null]
      - name: review_score
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [1, 2, 3, 4, 5], quote: false}
      - name: order_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_olist__orders'), field: order_id}

  - name: stg_olist__customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests: [not_null]
      - name: customer_state
        data_tests:
          - relationships:
              arguments: {to: ref('br_states'), field: state_code}

  - name: stg_olist__sellers
    columns:
      - name: seller_id
        data_tests: [unique, not_null]
      - name: seller_state
        data_tests:
          - relationships:
              arguments: {to: ref('br_states'), field: state_code}

  - name: stg_olist__products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: category
        description: English category; 'unknown' when the source category is null (610 products).
        data_tests: [not_null]

  - name: stg_olist__geolocation
  - name: stg_olist__closed_deals
    columns:
      - name: mql_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments: {to: ref('stg_olist__mqls'), field: mql_id}
      - name: seller_id
        data_tests: [unique, not_null]
  - name: stg_olist__mqls
    columns:
      - name: mql_id
        data_tests: [unique, not_null]
